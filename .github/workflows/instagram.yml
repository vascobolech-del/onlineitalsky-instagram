name: Instagram – Online Italsky

on:
  schedule:
    # Každý den 7:07–18:37 UTC (= zhruba 8–20 h v Praze, v létě i v zimě), dvakrát za hodinu.
    # Skript zveřejní jen příspěvek, jehož termín (pražský čas) už nastal; ostatní běhy hned skončí.
    - cron: "7,37 7-18 * * *"
  workflow_dispatch:
    inputs:
      rezim:
        description: "test = jen ověřit spojení · publikovat-ted = zveřejnit další příspěvek hned · nanecisto = ukázat, co by se stalo"
        type: choice
        options: [test, nanecisto, publikovat-ted]
        default: test

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  zverejnit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Zveřejnit příspěvek na řadě
        run: python3 scripts/publish.py
        env:
          MODE: ${{ github.event.inputs.rezim || 'plan' }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FACEBOOK: ${{ vars.FACEBOOK || '1' }}

      - name: Zapsat zveřejněný příspěvek
        if: always()
        run: |
          if ! git diff --quiet -- odeslano.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add odeslano.json
            git commit -m "Instagram: zveřejněn další příspěvek"
            git push
          fi
